name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste credentials, account numbers, balances, positions or order ids.** Use paper mode or synthetic data to reproduce.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands and configuration (with placeholder values) that reproduce it.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - paper
        - lab (offline research)
        - live
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version and commit.
      placeholder: Windows 11, Python 3.12, abc1234
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Redact anything private before pasting.
      render: text
