name: Question
description: Ask about usage or design (Discussions are preferred for open questions)
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended questions please use [Discussions](../../discussions). Never share credentials or account data.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: What you already tried
